[project]
name = "encoding-roundtrip-skill-dev"
version = "0.1.2"
description = "Development environment (tests) for the encoding-roundtrip agent skill. The skill itself needs only Python 3.10+."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.0", "pytest-cov>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/encoding-roundtrip/scripts"]

[tool.coverage.run]
branch = false
